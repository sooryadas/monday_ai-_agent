# Fly.io configuration for Monday.com BI Agent
app = "monday-bi-agent"
primary_region = "ord"

[build]
builder = "pacer"

[env]
PORT = "8080"

[[services]]
internal_port = 8080
protocol = "tcp"
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

  [services.concurrency]
  type = "connections"
  hard_limit = 30
  soft_limit = 20

  [[services.ports]]
  port = 80
  handlers = ["http"]
  force_https = true

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  [[services.tcp_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "5s"
